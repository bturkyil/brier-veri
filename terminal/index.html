<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brier Terminal</title>
<meta name="description" content="The record of a matchup — rest, availability, home/away, conditions, last meeting. NBA · WNBA · NFL · NCAAF · MLB. Not a tip.">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F1; --card:#FFFFFF; --ink:#16211F; --dark:#16211F; --ink2:#3A4745; --grey:#6B7876; --rule:#D9E0DE; --rule-dark:#B9C4C1;
    --rec:#0E7C6B; --rec-soft:#DCEFEA; --mkt:#9A6A12; --mkt-soft:#F3E8CF; --red:#A33A2E; --red-soft:#F3DDD9;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --sans:'Archivo',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --paper:#121917; --card:#1A2321; --ink:#EDF2F0; --ink2:#C7D1CE; --grey:#8E9C99; --rule:#273431; --rule-dark:#3A4845; --rec:#4FC2A8; --rec-soft:#173A33; --mkt:#D9A74A; --mkt-soft:#3A2F14; --red:#E08A7C; --red-soft:#3F2320; } }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  b{font-weight:600}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  /* ust cubuk */
  .top{background:var(--dark);color:#fff}
  .top .in{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;height:52px}
  .top .brand{font-weight:800;letter-spacing:1.6px;font-size:16px;text-decoration:none;color:#fff}
  .top .brand span{font-weight:400;letter-spacing:.2px;opacity:.7;margin-left:8px;font-size:13px}
  .top nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
  .top nav button{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 11px;border:0;background:transparent;color:#fff;opacity:.6;border-radius:3px;cursor:pointer;white-space:nowrap}
  .top nav button.on{opacity:1;background:rgba(255,255,255,.14)} .top nav button:hover{opacity:1}
  .top .motto{margin-left:auto;font-size:12px;opacity:.6;white-space:nowrap}
  .wrap{max-width:1360px;margin:0 auto;padding:0 16px 56px}
  .layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start;padding-top:14px}
  .left{position:sticky;top:0;max-height:100vh;overflow:auto;padding-right:2px;scrollbar-width:thin}
  .right{min-width:0}
  .daynav{display:flex;align-items:center;gap:4px;margin:4px 0 8px}
  .daynav button{font-family:var(--sans);font-size:14px;font-weight:600;padding:8px 12px;border:1px solid var(--rule-dark);background:var(--card);color:var(--ink);border-radius:3px;cursor:pointer}
  .daynav .lab{flex:1;text-align:center} .daynav .lab small{display:block;font-weight:400;font-size:11.5px;color:var(--grey)}
  .daynav button:disabled{opacity:.35;cursor:default}
  .top nav .sp{position:relative} .top nav .sp>button{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 11px;border:0;background:transparent;color:#fff;opacity:.6;border-radius:3px;cursor:pointer;white-space:nowrap}
  .top nav .sp.on>button{opacity:1;background:rgba(255,255,255,.14)} .top nav .sp:hover>button,.top nav .sp:focus-within>button{opacity:1}
  .top nav .sp .dd{display:none;position:absolute;left:0;top:100%;background:var(--card);border:1px solid var(--rule-dark);border-radius:3px;min-width:160px;padding:6px;z-index:20;box-shadow:0 12px 30px -14px rgba(0,0,0,.5)}
  .top nav .sp:hover .dd,.top nav .sp:focus-within .dd{display:block}
  .top nav .dd a,.top nav .dd button{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 10px;border:0;background:transparent;color:var(--ink);border-radius:3px;cursor:pointer;text-decoration:none}
  .top nav .dd a:hover,.top nav .dd button:hover{background:var(--paper)} .top nav .dd .cur{color:var(--rec)}
  .tabs{display:flex;gap:2px;margin:14px 0 10px;border-bottom:1px solid var(--rule-dark);overflow-x:auto;scrollbar-width:none}
  .tabs button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--grey);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .pane{display:none} .pane.on{display:block}
  .empty.tall{padding:80px 20px;font-size:14px}
  .back{display:none;font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 0;border:0;background:transparent;color:var(--rec);cursor:pointer}
  /* gun seridi + cipler */
  .days{display:flex;gap:4px;margin:18px 0 10px;overflow-x:auto;scrollbar-width:none}
  .days button{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 12px;border:1px solid var(--rule-dark);background:var(--card);color:var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
  .days button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .days button small{font-weight:400;color:inherit;opacity:.7;margin-left:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .chip{font-family:var(--sans);font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--rule-dark);background:var(--card);color:var(--ink2);border-radius:999px;cursor:pointer}
  .chip.on{background:var(--rec-soft);border-color:var(--rec);color:var(--rec)} .chip .n{opacity:.6;margin-left:4px;font-weight:400}
  /* skorboard */
  .board{background:var(--card);border:1px solid var(--rule-dark);border-radius:4px;overflow:hidden}
  .row{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"t h b" "t a b" "t m m";row-gap:2px;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid var(--rule);cursor:pointer;text-align:left;background:transparent;color:inherit;font:inherit;width:100%}
  .row:first-child{border-top:0} .row:hover{background:var(--paper)} .row.on{box-shadow:inset 3px 0 0 var(--rec)}
  .row .time{font-family:var(--mono);font-size:11.5px;color:var(--grey);grid-area:t}
  .row .tm{grid-area:h} .row .tm.r{grid-area:a} .row .mk{grid-area:m;max-width:220px} .row .badges{grid-area:b;max-width:110px;align-self:start}
  .row .tm{font-weight:600;font-size:13.5px;line-height:1.25} .row .tm.r{text-align:left}
  .row .mk{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
  .row .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:220px}
  .bd{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--ink2);border:1px solid var(--rule);white-space:nowrap}
  .bd.mkt{background:var(--mkt-soft);color:var(--mkt);border-color:transparent} .bd.rec{background:var(--rec-soft);color:var(--rec);border-color:transparent} .bd.warn{background:var(--red-soft);color:var(--red);border-color:transparent}
  .pbar{flex:1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden;position:relative} .pbar i{display:block;height:100%;background:var(--mkt)}
  .pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
  .pick label{font-size:12.5px;color:var(--grey);margin-right:4px}
  select{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule-dark);border-radius:3px;background:var(--card);color:var(--ink);max-width:44vw}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink)}
  /* mac basligi */
  .mhead{margin:28px 0 14px;padding:18px 20px;background:var(--card);border:1px solid var(--rule-dark);border-radius:4px}
  .mhead .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
  .mhead .tn{font-size:24px;font-weight:800;letter-spacing:-.2px;line-height:1.15} .mhead .tn.r{text-align:right}
  .mhead .tn small{display:block;font-size:12px;font-weight:400;color:var(--grey);letter-spacing:0;margin-top:2px}
  .mhead .vs{font-family:var(--mono);font-size:12px;color:var(--grey);text-align:center}
  .mhead .mline{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--mono);font-size:12.5px}
  .mhead .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--grey)}
  .mhead .meta .share{margin-left:auto}
  /* kartlar */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tgol{background:var(--card);border:1px solid var(--rule-dark);padding:14px 16px 12px;border-radius:4px;min-width:0}
  .tgol .th{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:0}
  .tgol .th .n{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--grey);margin-left:8px}
  .tgol .tbaslik{font-size:16px;font-weight:600;margin-top:8px}
  .tgol .ts{font-size:13.5px;line-height:1.7;margin-top:8px;color:var(--ink)}
  .tgol .tf{font-size:11px;color:var(--grey);margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);line-height:1.5}
  .rins{margin-top:10px;padding:8px 10px;background:var(--paper);border-left:3px solid var(--rec);font-size:13px;line-height:1.55;color:var(--ink2);border-radius:0 3px 3px 0}
  .rnum{font-family:var(--mono);color:var(--ink);font-weight:600;margin-left:2px}
  .kartArti{color:var(--rec);font-weight:600} .kartEksi{color:var(--red);font-weight:600}
  .grid .grid{margin-top:4px} .grid .grid>div{min-width:0}
  .grid .th.sub{font-size:12px;color:var(--grey);font-weight:600}
  table.box{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.box th{font-size:11px;color:var(--grey);text-align:right;font-weight:600;padding:4px 4px;border-bottom:1px solid var(--rule)}
  table.box th:first-child,table.box td:first-child{text-align:left}
  table.box td{padding:4px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
  table.box td:first-child{font-family:var(--sans)} table.box tr.st td:first-child{font-weight:600}
  .dnp{font-size:12px;color:var(--grey);margin-top:6px} .dnp b{color:var(--ink)}
  /* barlar */
  .bar{display:inline-block;vertical-align:middle;width:110px;height:7px;background:var(--rule);border-radius:4px;overflow:hidden;margin:0 6px;position:relative}
  .bar i{display:block;height:100%;background:var(--rec)} .bar.mkt i{background:var(--mkt)}
  .bar.mid::after{content:'';position:absolute;left:50%;top:-2px;width:1px;height:11px;background:var(--ink)}
  .stack{display:flex;height:10px;border-radius:4px;overflow:hidden;margin:6px 0 4px}
  .stack i{display:block;height:100%} .stack i.lo{background:var(--rec)} .stack i.md{background:var(--rule-dark)} .stack i.hi{background:var(--mkt)}
  .split{display:flex;height:10px;border-radius:4px;overflow:hidden;margin:6px 0 2px} .split i{display:block;height:100%} .split i.h{background:var(--rec)} .split i.a{background:var(--rule-dark)}
  .dbar{display:inline-block;vertical-align:middle;width:60px;height:6px;background:var(--rule);position:relative;margin:0 4px;border-radius:3px}
  .dbar i{position:absolute;top:0;height:100%;background:var(--rec)} .dbar i.neg{background:var(--red)}
  .dbar::after{content:'';position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--ink2)}
  .wl{font-family:var(--mono);font-size:11px;letter-spacing:1px} .wl .w{color:var(--rec)} .wl .l{color:var(--red)}
  /* the record says */
  .tgol.says{background:var(--dark);color:#fff;border-color:var(--dark);padding:18px 20px}
  .tgol.says .th{color:#fff;font-size:15px} .tgol.says .ts{color:#fff;font-size:15px;line-height:1.75}
  .tgol.says .ts div{padding:6px 0;border-top:1px solid rgba(255,255,255,.12)} .tgol.says .ts div:first-child{border-top:0}
  .tgol.says .tf{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15)}
  .tgol.says .rnum{color:#fff;background:rgba(255,255,255,.14);padding:0 6px;border-radius:3px}
  .tgol.says .kartArti{color:#7fd1bf} .tgol.says .kartEksi{color:#f0a090}
  .empty{padding:20px;color:var(--grey);text-align:center;font-size:13px}
  .note{font-size:12px;color:var(--grey);line-height:1.6;margin-top:18px;max-width:72ch}
  .err{color:var(--red)}
  .sec{font-size:12.5px;font-weight:600;color:var(--grey);margin:20px 0 8px}
  :focus-visible{outline:2px solid var(--rec);outline-offset:2px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:0} .left{position:static;max-height:none}
    .layout.open .left{display:none} .layout:not(.open) .right{display:none} .back{display:inline-block}
  }
  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    .mhead .tn{font-size:18px} .top .motto{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="brand" href="../">BRIER<span>Terminal</span></a>
  <nav id="ligbar" aria-label="Sport and league"></nav>
  <div class="motto">the record, not the tip</div>
</div></div>
<div class="wrap layout" id="layout">
  <aside class="left">
    <div class="daynav"><button type="button" id="dayPrev" aria-label="Previous day">‹</button><button type="button" id="dayLab" class="lab"></button><button type="button" id="dayNext" aria-label="Next day">›</button></div>
    <div class="chips" id="chips"></div>
    <div id="list" class="board"><div class="empty">Loading the slate…</div></div>
    <div class="pick">
      <label for="selH">Or open any two teams</label>
      <select id="selH"></select><span class="mono" style="color:var(--grey)">vs</span><select id="selA"></select>
      <button class="btn" id="goBtn" type="button">Open the record</button>
    </div>
    <div class="note" id="note"></div>
  </aside>
  <main class="right" id="right">
    <div id="detail"><div class="empty tall">Pick a game on the left, or open any two teams. The record opens here.</div></div>
  </main>
</div>

<script>
const HOST='https://worker-production-a1ba.up.railway.app';
const LIGS={
  nba:  {ad:'NBA',  spor:'basketball',feed:/^basketball_nba/,      note:'Five NBA seasons of box scores (public archive), every player every night. "Sat" = on the roster with no minutes — injury, rest or coach\'s decision, not separated.'},
  wnba: {ad:'WNBA', spor:'basketball',feed:/^basketball_wnba/,     note:'Six WNBA seasons of box scores (public archive), 2021–2026, every player every night. "Sat" = on the roster with no minutes.'},
  nfl:  {ad:'NFL',  spor:'football',  feed:/^americanfootball_nfl/, note:'Six NFL seasons of box scores (public archive), 2021–2026, every game including playoffs. Rest counts calendar days between kickoffs.'},
  ncaaf:{ad:'NCAAF',spor:'football',  feed:/^americanfootball_ncaaf/,note:'Six FBS seasons of box scores (public archive), 2021–2026. Profiles use the top and bottom third of FBS that season; FCS opponents appear in the record but carry no profile.'},
  mlb:  {ad:'MLB',  spor:'baseball',  feed:/^baseball_mlb/,        note:'Six MLB seasons of box scores (public archive), 2021–2026, every game including the postseason. Lineup and pitching lines are from the box, not projections.'}
};
const Q=new URLSearchParams(location.search);
let LIG=LIGS[Q.get('lig')]?Q.get('lig'):'nba';
let DATA=LIG+'/', ODDS_HIST='../odds_history/'+LIG+'.json';
let IDX=null, LEAGUE=null, TEAMS=[], TCACHE={}, OH=null, TONIGHT=[];
const SPOR=()=>LIGS[LIG].spor, NEW=()=>!!(IDX&&IDX.spor);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const pct=(w,n)=>n>0?Math.round(1000*w/n)/10:null;
const fair=(p)=>(p!=null&&p>0)?(1/p).toFixed(2):null;
const usDate=(iso)=>{try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'});}catch(e){return String(iso||'').slice(0,10);}};
const niceDate=(ymd)=>{try{const d=new Date(ymd+'T12:00:00Z');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return ymd;}};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000);
const avg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
const f1=(x)=>x==null?'—':(Math.round(x*10)/10).toFixed(1);
const bar=(p,cls='')=>`<span class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,p||0))}%"></i></span>`;
const dbar=(pct)=>{const w=Math.min(30,Math.abs(pct||0));return `<span class="dbar"><i class="${pct<0?'neg':''}" style="${pct<0?'right':'left'}:50%;width:${w}%"></i></span>`;};
const ci=(p,n)=>n>0?Math.round(1.96*Math.sqrt(p*(100-p)/n)*10)/10:null;   // %95 guven araligi, yuzde puan
const wl=(gs)=>`<span class="wl">${gs.map(g=>g.won?'<span class="w">W</span>':'<span class="l">L</span>').join('')}</span>`;
const sd=(d)=>{const v=Math.round(d*10)/10;return (v>0?'+':'')+v.toFixed(1);};
// arsiv ham degerleri: "4-8" -> 4 ; "12/19" -> 12 ; "+4" -> 4 ; "--" -> null
function num(s){ if(s==null)return null; if(typeof s==='number')return s; s=String(s).trim(); if(s===''||s==='--'||s==='-')return null;
  if(/^[+-]?\d+(\.\d+)?$/.test(s))return parseFloat(s); const m=s.match(/^(\d+(\.\d+)?)/); return m?parseFloat(m[1]):null; }
function num2(s){ const m=String(s==null?'':s).match(/^\d+(\.\d+)?[-\/](\d+(\.\d+)?)/); return m?parseFloat(m[2]):null; }

// ---- spor konfigurasyonu ----
const CFG={
  basketball:{unit:'pts',unitLong:'pts/game',xray:[['pts','points'],['reb','rebounds'],['tpm','threes'],['ast','assists']],
              cond:[['pts','points'],['reb','rebounds'],['ast','assists'],['tpm','threes'],['pf','fouls']],ptsLead:2},
  football:  {unit:'pts',unitLong:'pts/game',xray:[['pts','points'],['pass_yds','pass yds'],['rush_yds','rush yds'],['to','turnovers']],
              cond:[['pts','points'],['pass_yds','pass yds'],['rush_yds','rush yds'],['to','turnovers'],['sacks','sacks']],ptsLead:2},
  baseball:  {unit:'runs',unitLong:'runs/game',xray:[['pts','runs'],['h','hits'],['hr','homers'],['k','strikeouts']],
              cond:[['pts','runs'],['h','hits'],['hr','homers'],['k','strikeouts'],['bb','walks']],ptsLead:0.4}
};
const SZ_OF=(ymd)=>{const y=+ymd.slice(0,4), m=+ymd.slice(5,7);
  if(LIG==='nba')return m>=9?`${y}-${String(y+1).slice(2)}`:`${y-1}-${String(y).slice(2)}`;
  if(SPOR()==='football')return String(m>=8?y:y-1); return String(y);};
const MIN_N=15;

// ---- takim esleme: The Odds API adi -> arsiv takimi (tam ad -> alias -> lakap(son kelime)) ----
const ALIAS={'la clippers':'los angeles clippers','los angeles clippers':'la clippers','oakland athletics':'athletics','cleveland indians':'cleveland guardians','washington football team':'washington commanders'};
function findTeam(name){
  if(!name||!TEAMS.length)return null;
  const n=String(name).toLowerCase().trim();
  let t=TEAMS.find(x=>x.ad.toLowerCase()===n); if(t)return t;
  if(ALIAS[n]){t=TEAMS.find(x=>x.ad.toLowerCase()===ALIAS[n]); if(t)return t;}
  const nick=n.split(' ').pop();
  const c=TEAMS.filter(x=>x.ad.toLowerCase().split(' ').pop()===nick);
  if(c.length===1)return c[0];
  if(c.length>1){const c2=c.filter(x=>n.includes(x.ad.toLowerCase().split(' ')[0]));if(c2.length===1)return c2[0];}
  const c3=TEAMS.filter(x=>n.includes(x.ad.toLowerCase())||x.ad.toLowerCase().includes(n)); if(c3.length===1)return c3[0];
  return null;
}
const KISA={'boston red sox':'Red Sox','chicago white sox':'White Sox','toronto blue jays':'Blue Jays','portland trail blazers':'Trail Blazers'};
const short=(t)=>t.kisa||t.ad;
const poss=(s)=>/s$/i.test(s)?s+"'":s+"'s";
async function teamFile(t){
  if(TCACHE[t.slug])return TCACHE[t.slug];
  const r=await fetch(DATA+'teams/'+t.slug+'.json',{cache:'no-store'});
  const f=r.ok?await r.json():null; if(f)enrich(t,f); TCACHE[t.slug]=f; return f;
}

// yeni semada takim ozeti dosyadan hesaplanir (NBA index'te hazir gelir)
function enrich(t,f){
  if(t.home)return; const gs=f.games||[];

  const B=gs.filter(g=>g.b2b); t.b2b=[B.length,B.filter(g=>g.won).length];

    const szs=[...new Set(gs.map(g=>g.sz))].sort().slice(-2); const P={};
    gs.filter(g=>szs.includes(g.sz)).forEach(g=>{bRows(g).forEach(r=>{if(r.min==null||r.min<=0)return;const o=P[r.ad]||(P[r.ad]={gp:0,pts:0});o.gp++;o.pts+=r.pts||0;});});
    t.stars=Object.entries(P).filter(([_,o])=>o.gp>=15).map(([ad,o])=>({ad,gp:o.gp,ppg:Math.round(10*o.pts/o.gp)/10})).sort((x,y)=>y.ppg-x.ppg).slice(0,8);

// ---- MATCHUP X-RAY: takim vs rakip (+ basketbolda oyuncu vs rakip). KURAL: n < MIN_N -> gosterme, not yaz ----
function matchupSplit(games,oppAd){
  const vs=games.filter(g=>g.opp===oppAd); const vsS=vs.map(gStats), allS=games.map(gStats);
  const rows=CFG[SPOR()].xray.map(([k,label])=>{const v=vsS.map(x=>x[k]).filter(x=>x!=null), a=allS.map(x=>x[k]).filter(x=>x!=null);
    if(v.length<MIN_N||!a.length)return null; const mv=avg(v),ma=avg(a); return {k,label,vs:mv,norm:ma,d:mv-ma,pct:ma?(mv-ma)/ma*100:0};}).filter(Boolean);
  return {n:vs.length,seasons:[...new Set(vs.map(g=>g.sz))].sort(),rows};
}
function playerSplits(games,oppAd,stars){
  return (stars||[]).map(s=>{
    const row=g=>bRows(g).find(p=>p.ad===s.ad&&p.min>0);
    const vs=games.filter(g=>g.opp===oppAd).map(row).filter(Boolean), all=games.map(row).filter(Boolean);
    if(vs.length<MIN_N||!all.length)return {ad:s.ad,n:vs.length,shown:false};
    const m=(rows,k)=>{const v=rows.map(r=>r[k]).filter(x=>x!=null);return v.length?avg(v):null;};
    const out={ad:s.ad,n:vs.length,shown:true,pts:[m(vs,'pts'),m(all,'pts')],reb:[m(vs,'reb'),m(all,'reb')]};
    const t=m(vs,'tpm'), tn=m(all,'tpm'); if(t!=null&&tn!=null)out.tpm=[t,tn];
    return out;
  });
}

  const fmt=(r)=>`<b>${r.label}</b> ${r.vs.toFixed(1)} <span style="color:var(--grey)">vs their norm ${r.norm.toFixed(1)}</span> <span class="${r.d>0.05?'kartArti':(r.d<-0.05?'kartEksi':'')}">${sd(r.d)} (${r.pct>0?'+':''}${r.pct.toFixed(0)}%)</span>`;
  const side=(t,o,m)=>`<div><div class="th sub">${esc(short(t))} vs ${esc(short(o))}</div><div class="ts">${m.rows.map(fmt).join('<br>')}</div></div>`;
  let players='',hid='';
  if(SPOR()==='basketball'){

// ---- CONDITIONS X-RAY: rakibi ISMIYLE degil PROFILIYLE tanimla (lig icinde ust/alt ucluk), o profile karsi sicil ----
function oppProfile(teamAd,ymd){
  const P=(IDX&&IDX.profiles&&IDX.profiles[teamAd])||null; if(!P)return null;
  const cur=SZ_OF(ymd); const szs=Object.keys(P).sort(); const minGp=IDX.min_gp||MIN_N;
  let use=cur, early=false;
  if(!P[cur]||(P[cur].gp||0)<minGp){ const prev=szs.filter(z=>z<cur).pop(); if(!prev)return null; use=prev; early=true; }
  return {season:use,early,curGp:P[cur]?P[cur].gp:0,prof:P[use]};
}
function condSplits(games,metric,tier){
  const PR=(IDX&&IDX.profiles)||{};
  const vs=games.filter(g=>{const p=PR[g.opp]&&PR[g.opp][g.sz]; return p&&p.tiers&&p.tiers[metric]===tier;});
  if(vs.length<MIN_N)return {n:vs.length,rows:[]};
  const vsS=vs.map(gStats), allS=games.map(gStats);
  const rows=CFG[SPOR()].cond.map(([k,label])=>{const v=vsS.map(x=>x[k]).filter(x=>x!=null), a=allS.map(x=>x[k]).filter(x=>x!=null);
    if(v.length<MIN_N||!a.length)return null; const mv=avg(v),ma=avg(a); return {k,label,vs:mv,norm:ma,d:mv-ma,pct:ma?(mv-ma)/ma*100:0};}).filter(Boolean);
  return {n:vs.length,rows};
}
function cardConditions(h,a,hf,af,ymd){
  const L=(IDX&&IDX.tier_labels)||{}; const C=CFG[SPOR()];

  const sideBlock=(X,O,Xf)=>{
    const op=oppProfile(O.ad,ymd);
    if(!op)return {html:`<div><div class="th sub">${esc(short(X))} vs teams like ${esc(short(O))}</div><div class="ts" style="color:var(--grey)">No profile for ${esc(short(O))} in the record.</div></div>`,best:null,bestPts:null};

    const warn=`<div class="ts" style="color:var(--grey);margin-top:4px">${esc(short(O))} profile${op.early?` (${op.season} — only ${op.curGp} games this season, so last full season shown)`:` (${op.season})`}: ${conds.length?conds.map(([m,t])=>`<b>${esc(label(m,t))}</b>`).join(' · '):'average on every measure'}.${oppQuality(X,O,Xf,ymd)}</div>`;

    <div class="grid" style="margin-top:8px">${A.html}${B.html}</div>${ins?`<div class="rins">${ins}</div>`:''}
    <div class="tf">profile = top/bottom third of the league that season · deltas vs that side's own average · shown only at ${MIN_N}+ games · colour at ±5%</div></div>`;
}

// ---- LIG CAPINDA MAC LISTESI (games.json): ikizler, oyun senaryosu, ATS ----
let GL=null, ZS=null, TOTQ=null, PAV={};
async function gamesList(){ if(GL!==null)return GL;
  try{const r=await fetch(DATA+'games.json',{cache:'no-store'}); const j=r.ok?await r.json():null;
    GL=j?j.games.map(r=>({t:r[0],h:r[1],a:r[2],hs:r[3],as:r[4],sz:r[5],rh:r[6],ra:r[7],hh:r[8],ah:r[9],spd:r[10],ou:r[11],hml:r[12]??null,aml:r[13]??null})):false;}catch(e){GL=false;}
  return GL; }
const METS=()=>NEW()?(IDX.metrics||[]):['pts','pa','reb','ast','tpm','pf','to'];
const avgOf=(p)=>p?(NEW()?p.avg:p):null;
function profAvg(team,sz){ const k=team+'|'+sz; if(k in PAV)return PAV[k];
  const p=IDX.profiles&&IDX.profiles[team]&&IDX.profiles[team][sz]; const src=avgOf(p); let o=null;
  if(src&&(p.gp||0)>=(IDX.min_gp||MIN_N)){ o={}; for(const m of METS()){ if(src[m]==null){o=null;break;} o[m]=src[m]; } }
  PAV[k]=o; return o; }
function zstats(){ if(ZS)return ZS; ZS={}; const minGp=IDX.min_gp||MIN_N;
  for(const S of Object.values(IDX.profiles||{}))for(const [sz,p] of Object.entries(S)){ if((p.gp||0)<minGp)continue; const src=avgOf(p); const z=ZS[sz]||(ZS[sz]={});
    for(const m of METS()){ if(src[m]==null)continue; const a=z[m]||(z[m]={n:0,s:0,s2:0}); a.n++; a.s+=src[m]; a.s2+=src[m]*src[m]; } }
  for(const z of Object.values(ZS))for(const a of Object.values(z)){ a.mean=a.s/a.n; a.sd=Math.sqrt(Math.max(0,a.s2/a.n-a.mean*a.mean))||1; }
  return ZS; }
function zvec(prof,sz){ const z=zstats()[sz]; if(!z||!prof)return null; return METS().map(m=>z[m]?(prof[m]-z[m].mean)/z[m].sd:0); }
function restB(r){ if(r==null)return 1; if(SPOR()==='football')return r<=4?0:(r<=9?1:2); return r<=0?0:(r===1?1:(r<=3?2:3)); }
function feat(hp,ap,sz,rh,ra){ const zh=zvec(hp,sz), za=zvec(ap,sz); if(!zh||!za)return null; return [...zh,...za,restB(rh)*0.6,restB(ra)*0.6]; }
function totQ(){ if(TOTQ)return TOTQ; TOTQ={}; const by={}; for(const g of GL){ (by[g.sz]||(by[g.sz]=[])).push(g.hs+g.as); }
  for(const [sz,v] of Object.entries(by)){ v.sort((x,y)=>x-y); TOTQ[sz]=[v[Math.floor(v.length/3)],v[Math.floor(2*v.length/3)]]; } return TOTQ; }
const CLOSE={basketball:5,football:7,baseball:1};
const DNA_LAB={basketball:['defensive battle','middle band','shootout'],football:['low-scoring','middle band','shootout'],baseball:["pitchers' duel",'middle band','slugfest']};
const DNA_PH={'defensive battle':'a defensive battle','middle band':'in the middle band','shootout':'a shootout','low-scoring':'low-scoring',"pitchers' duel":"a pitchers' duel",'slugfest':'a slugfest'};
function twins(h,a,ymd,hR,aR){
  if(!GL||!GL.length)return null;
  const hp=oppProfile(h.ad,ymd), ap=oppProfile(a.ad,ymd); if(!hp||!ap)return null;
  const hz=zvec(avgOf(hp.prof),hp.season), az=zvec(avgOf(ap.prof),ap.season); if(!hz||!az)return null;
  const f0=[...hz,...az,restB(hR?hR.rest:null)*0.6,restB(aR?aR.rest:null)*0.6];
  const scored=[];
  for(const g of GL){ if(g.t>=ymd)continue; const f=feat(profAvg(g.h,g.sz),profAvg(g.a,g.sz),g.sz,g.rh,g.ra); if(!f)continue;
    let d=0; for(let i=0;i<f.length;i++){const e=f[i]-f0[i]; d+=e*e;} scored.push({g,d:Math.sqrt(d)}); }
  if(scored.length<MIN_N)return {n:scored.length,shown:false};
  scored.sort((x,y)=>x.d-y.d); const dMed=scored[Math.floor(scored.length/2)].d; const K=Math.min(40,scored.length); const top=scored.slice(0,K);
  const sim=(d)=>Math.min(99,Math.max(0,Math.round(100*(1-(d/dMed)*(d/dMed)))));   // 100 = ayni profil, 0 = lig medyani kadar uzak
  const Q=totQ(); let hw=0,hs=0,as=0,close=0,dna=[0,0,0],ov=0,nOu=0,hc=0,nSp=0;
  for(const {g} of top){ if(g.hs>g.as)hw++; hs+=g.hs; as+=g.as; if(Math.abs(g.hs-g.as)<=CLOSE[SPOR()])close++;
    const q=Q[g.sz]||[0,0]; const t=g.hs+g.as; dna[t<q[0]?0:(t>=q[1]?2:1)]++;
    if(g.ou!=null){nOu++; if(t>g.ou)ov++;} if(g.spd!=null){const c=g.hs-g.as+g.spd; if(c!==0){nSp++; if(c>0)hc++;}} }
  return {n:K,shown:true,list:top.slice(0,3).map(x=>({...x.g,sim:sim(x.d)})),homeW:pct(hw,K),avgH:hs/K,avgA:as/K,avgTot:(hs+as)/K,closePct:pct(close,K),
    dna:dna.map(x=>Math.round(100*x/K)),overPct:nOu>=MIN_N?pct(ov,nOu):null,nOu,homeCover:nSp>=MIN_N?pct(hc,nSp):null,nSp,avgSim:Math.round(top.reduce((s,x)=>s+sim(x.d),0)/K),early:hp.early||ap.early,pool:scored.length};
}
function cardTwins(h,a,T){

  return `<div class="tgol" style="grid-column:1/-1"><div class="th">Games like this<span class="n">${T.n} closest spots of ${T.pool.toLocaleString('en-US')}</span></div>

    const ph=devig(g.hml,g.aml); if(ph==null)continue; const p=home?ph:1-ph, y=home?(g.hs>g.as?1:0):(g.as>g.hs?1:0); const e=p-y;

// NFL: acilis (~6 gun once) -> kapanis. NBA/MLB: -24s -> kapanis (bu ligler en fazla ~1 gun once cizgi acar).
const FLOWCFG={

  nba:{first:'h24',lab:'the price 24 hours out',since:'in the last 24 hours',sp:true,spT:1,tot:1},

const FLOWMIN_BOOKS=3;

async function flowList(){

    const r=await fetch('../odds_flow/'+LIG+'.json',{cache:'no-store'}); if(!r.ok){FL=false;return FL;}
    const j=await r.json(); const by={};
    for(const f of (j.maclar||[])){ const k=nickOf(f.h)+'|'+nickOf(f.a); (by[k]=by[k]||[]).push(f); }

    for(const g of GL){
      if(g.hs==null||g.as==null)continue; const fl=by[nickOf(g.h)+'|'+nickOf(g.a)]; if(!fl)continue;
      let best=null,bd=9;

        pf:px(f0),pc:px(c),sf:f0&&f0[1]!=null?f0[1]:null,sc:c&&c[1]!=null?c[1]:null,tf:f0&&f0[2]!=null?f0[2]:null,tc:c&&c[2]!=null?c[2]:null,s:best.s});

const FB=[[0,1,'under 1'],[1,2,'1–2'],[2,4,'2–4'],[4,7,'4–7'],[7,999,'7 or more']];
function flowSum(){
  if(FSUM)return FSUM; let n=0,sf=0,sc=0,d1=0,d2=0; const B=FB.map(()=>[0,0,0]);
  for(const e of FL){
    if(e.pf==null||e.pc==null||e.y==null)continue;
    const ef=(e.pf-e.y)*(e.pf-e.y), ec=(e.pc-e.y)*(e.pc-e.y); n++; sf+=ef; sc+=ec; const d=ef-ec; d1+=d; d2+=d*d;
    const mv=(e.pc-e.pf)*100, ab=Math.abs(mv), home=mv>0, p=home?e.pc:1-e.pc, w=home?e.y:1-e.y;
    const i=FB.findIndex(b=>ab>=b[0]&&ab<b[1]); if(i>=0){B[i][0]++;B[i][1]+=w;B[i][2]+=p;}
  }
  const mean=n?d1/n:0, sdv=n>1?Math.sqrt(Math.max(0,(d2-n*mean*mean)/(n-1))):0;
  FSUM={n,bf:n?sf/n:null,bc:n?sc/n:null,diff:mean,dci:n>1?1.96*sdv/Math.sqrt(n):null,B}; return FSUM;

function flowTeam(team,ymd){   // piyasa bu takima dogru >=2 puan kaydiginda / aksi yone kaydiginda: kazanma vs kapanisin ima ettigi
  const r={to:[0,0,0],aw:[0,0,0]};
  for(const e of FL){
    if(e.t>=ymd||e.pf==null||e.pc==null||e.y==null)continue; const home=e.h===team; if(!home&&e.a!==team)continue;
    const d=(e.pc-e.pf)*100*(home?1:-1); if(Math.abs(d)<2)continue;
    const p=home?e.pc:1-e.pc, w=home?e.y:1-e.y, k=d>0?'to':'aw'; r[k][0]++; r[k][1]+=w; r[k][2]+=p;
  }

function flowLines(){

let LV=null;
async function liveList(){ if(LV!==null)return LV; try{ const r=await fetch('../odds_flow/live/'+LIG+'.json',{cache:'no-store'}); LV=r.ok?await r.json():false; }catch(e){LV=false;} return LV; }

function liveFor(hName,aName,whenIso){
  if(!LV||!LV.maclar)return null; const t0=whenIso?new Date(whenIso).getTime():Date.now(); let best=null,bd=1e18;
  for(const r of Object.values(LV.maclar)){ if(nickOf(r.h)!==nickOf(hName)||nickOf(r.a)!==nickOf(aName))continue;
    const tt=new Date(r.t).getTime(); const d=Math.abs(tt-t0); if(d<bd){bd=d;best=r;} }
  return best&&bd<(whenIso?12*3600e3:7*86400e3)?best:null;
}
async function liveMerge(){   // worker'in vermedigi yaklasan maclari (gelecek gunler) tahtaya ekle
  const L=await liveList(); if(!L||!L.maclar)return; const now=Date.now();
  for(const r of Object.values(L.maclar)){
    const tt=new Date(r.t).getTime(); if(tt<now-3*3600e3||!r.path||!r.path.length)continue;
    if(TONIGHT.some(m=>nickOf(m.h)===nickOf(r.h)&&nickOf(m.a)===nickOf(r.a)&&Math.abs(new Date(m.t).getTime()-tt)<12*3600e3))continue;

function cardLivePath(h,a,lv){

  (best.h||[]).forEach(x=>{(kt[x.k]=kt[x.k]||{}).h=x.o;}); (best.a||[]).forEach(x=>{(kt[x.k]=kt[x.k]||{}).a=x.o;});

    renderBoard();
    await Promise.all([gamesList(),oddsHist()]);
    TONIGHT.forEach(m=>{ try{m.badges=badgesFor(m);}catch(e){m.badges=[];} }); renderBoard();
    if(window.innerWidth>900&&!Q.get('h')){ const first=TONIGHT.find(m=>m.day===DAY); if(first){const r=document.querySelector('.row'); if(r)r.classList.add('on'); openRecord(first.h,first.a,first.t,first.p,first);} }   // masaustunde ilk mac acik gelsin
  }catch(e){box.innerHTML=`<div class="empty">The slate feed is unreachable — open any two teams below.</div>`;}
}
// yeni sema index'i NBA semasina normalize et: tier etiketi -> high/low/mid ; esik yoksa mid
function normalizeIdx(I){
  if(!I.spor)return;
  const TL=I.tier_labels||{};
  for(const t of Object.values(I.profiles||{}))for(const [sz,p] of Object.entries(t)){
    const thr=(I.tier_thr||{})[sz]||{}; const out={};
    for(const [m,v] of Object.entries(p.tiers||{})){ const q=thr[m]; const L=TL[m]||[];
      out[m]=(!q||q[0]===q[1])?'mid':(v===L[0]?'high':(v===L[1]?'low':'mid')); }
    p.tiers=out;
  }
  const junk=/all-star|^afc$|^nfc$|^team |^brazil$|^national$|^american$/i;
  I.teams=(I.teams||[]).filter(t=>!junk.test(t.ad)).map(t=>({...t,kisa:LIG==='ncaaf'?t.ad:(KISA[t.ad.toLowerCase()]||t.ad.split(' ').pop())}));
}
const SPORTS=[['Basketball',['nba','wnba']],['Football',['nfl','ncaaf']],['Baseball',['mlb']],['Soccer',null]];
function renderLigbar(){
  document.getElementById('ligbar').innerHTML=SPORTS.map(([ad,ligs])=>{
    const on=ligs&&ligs.includes(LIG);
    const dd=ligs?ligs.map(k=>`<button type="button" data-lig="${k}" class="${k===LIG?'cur':''}">${LIGS[k].ad}</button>`).join(''):`<a href="../app/">35 leagues — open the app</a>`;
    return `<div class="sp ${on?'on':''}"><button type="button">${ad}${on?' · '+LIGS[LIG].ad:''}</button><div class="dd">${dd}</div></div>`;}).join('');
  document.querySelectorAll('#ligbar .dd button').forEach(b=>b.addEventListener('click',()=>{const u=new URL(location.href);u.search='';u.searchParams.set('lig',b.dataset.lig);location.href=u.toString();}));
  document.querySelectorAll('#ligbar .sp>button').forEach(b=>b.addEventListener('click',()=>{const first=b.parentElement.querySelector('.dd button'); if(first&&!b.parentElement.classList.contains('on'))first.click();}));
}
async function boot(){
  renderLigbar();
  document.getElementById('note').textContent=LIGS[LIG].note+' Odds history builds daily from the archive; Line flow comes from archived price snapshots (NFL, NBA, MLB). Direction, not advice. Build T10.';
  document.title=`Brier Terminal — ${LIGS[LIG].ad}`;
  try{
    const r=await fetch(DATA+'index.json',{cache:'no-store'}); IDX=await r.json(); normalizeIdx(IDX);
    TEAMS=IDX.teams||[]; LEAGUE=IDX.league||{};
    const sel=TEAMS.filter(t=>(t.gp||0)>=10).slice().sort((x,y)=>x.ad.localeCompare(y.ad));
    const opts=sel.map(t=>`<option value="${esc(t.ad)}">${esc(t.ad)}</option>`).join('');
    document.getElementById('selH').innerHTML=opts; document.getElementById('selA').innerHTML=opts;
    document.getElementById('selA').selectedIndex=Math.min(1,sel.length-1);
    document.getElementById('goBtn').addEventListener('click',()=>openRecord(document.getElementById('selH').value,document.getElementById('selA').value,null));
    loadTonight();
    if(Q.get('h')&&Q.get('a')){ openRecord(Q.get('h'),Q.get('a'),null); }
  }catch(e){document.getElementById('list').innerHTML=`<div class="empty err">Record index not found (${esc(DATA)}index.json). Upload terminal/${esc(LIG)} first.</div>`;}
}
boot();
</script>
