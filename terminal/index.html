<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brier Terminal</title>
<meta name="description" content="The record of a matchup — rest, availability, home/away, conditions, last meeting. NBA · WNBA · NFL · NCAAF · MLB. Not a tip.">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F5F4; --ink:#16211F; --rule:#D7DEDC; --rule-dark:#B9C4C1;
    --teal:#0E7C6B; --teal-soft:#E3EFEC; --gold:#9A751F; --grey:#5C6B68; --red:#A33A2E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;font-size:14px;line-height:1.5}
  header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;letter-spacing:1.5px;font-weight:800}
  header .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75}
  header .motto{margin-left:auto;font-size:11px;opacity:.75;letter-spacing:.4px}
  .ligbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--rule-dark)}
  .ligbar button{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:.5px;padding:6px 12px;border:1px solid var(--rule-dark);background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
  .ligbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
  .sec{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--grey);margin:18px 0 8px;text-transform:uppercase}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
  .mrow{background:#fff;border:1px solid var(--rule-dark);border-radius:2px;padding:10px 12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
  .mrow:hover{background:var(--teal-soft)} .mrow.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .mrow .t{font-weight:700;font-size:13.5px} .mrow .w{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--grey);margin-top:3px}
  .pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule-dark);border-radius:2px;background:#fff;color:var(--ink);max-width:46vw}
  .btn{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;padding:8px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:2px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink)}
  .dhead{margin:22px 0 6px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap} .dhead .teams{font-size:20px;font-weight:800;letter-spacing:.2px} .dhead .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--grey);margin-top:3px}
  .dhead .share{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
  .tgol{background:#fff;border:1px solid var(--rule-dark);padding:12px 16px;border-radius:2px}
  .tgol .th{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--grey)}
  .tgol .tbaslik{font-size:15px;font-weight:600;margin-top:6px;color:var(--ink)}
  .tgol .ts{font-size:13px;line-height:1.7;margin-top:6px;color:var(--ink)} .tgol .ts b{font-weight:600}
  .tgol .tf{font-size:10.5px;color:var(--grey);margin-top:8px;padding-top:7px;border-top:1px solid var(--rule);font-family:'IBM Plex Mono',monospace}
  .rins{color:var(--grey);font-size:.84em;margin-top:8px;line-height:1.5}
  .rnum{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;margin-left:4px}
  .kartArti{color:var(--teal);font-weight:600} .kartEksi{color:var(--red);font-weight:600}
  .mono{font-family:'IBM Plex Mono',monospace}
  table.box{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  table.box th{font-size:10px;letter-spacing:.5px;color:var(--grey);text-align:right;font-weight:700;padding:3px 4px;border-bottom:1px solid var(--rule)}
  table.box th:first-child,table.box td:first-child{text-align:left}
  table.box td{padding:3px 4px;text-align:right;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid var(--rule)}
  table.box td:first-child{font-family:'Archivo',sans-serif}
  table.box tr.st td:first-child{font-weight:600}
  .dnp{font-size:11.5px;color:var(--grey);margin-top:6px} .dnp b{color:var(--ink);font-weight:600}
  .empty{padding:18px;color:var(--grey);text-align:center;font-size:12.5px}
  .note{font-size:11px;color:var(--grey);line-height:1.55;margin-top:14px}
  .err{color:var(--red);font-size:12px}
  .tgol.says{background:var(--ink);color:#fff;border-color:var(--ink)} .tgol.says .th{color:#9fb3ae} .tgol.says .ts{color:#fff} .tgol.says .tf{color:#9fb3ae;border-color:#2c3a37} .tgol.says .rnum{color:#fff;background:rgba(255,255,255,.12);padding:0 5px;border-radius:2px} .tgol.says .kartArti{color:#7fd1bf} .tgol.says .kartEksi{color:#f0a090}
  @media (max-width:600px){ .dhead .teams{font-size:17px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>BRIER</h1><span class="tag" id="tag">terminal · build T6</span>
  <span class="motto">the record, not the tip</span>
</header>
<div class="ligbar" id="ligbar"></div>
<div class="wrap">
  <div class="sec" id="secTonight">Tonight</div>
  <div id="list" class="list"><div class="empty">Loading tonight's games…</div></div>
  <div class="sec">Or pick any two teams</div>
  <div class="pick">
    <select id="selH"></select><span class="mono" style="color:var(--grey)">vs</span><select id="selA"></select>
    <button class="btn" id="goBtn" type="button">OPEN THE RECORD</button>
  </div>
  <div id="detail"></div>
  <div class="note" id="note"></div>
</div>

<script>
const HOST='https://worker-production-a1ba.up.railway.app';
const LIGS={
  nba:  {ad:'NBA',  spor:'basketball',feed:/^basketball_nba/,      note:'Five NBA seasons of box scores (ESPN), every player every night. "Sat" = on the roster with no minutes — injury, rest or coach\'s decision, not separated.'},
  wnba: {ad:'WNBA', spor:'basketball',feed:/^basketball_wnba/,     note:'Six WNBA seasons of box scores (ESPN), 2021–2026, every player every night. "Sat" = on the roster with no minutes.'},
  nfl:  {ad:'NFL',  spor:'football',  feed:/^americanfootball_nfl/, note:'Six NFL seasons of box scores (ESPN), 2021–2026, every game including playoffs. Rest counts calendar days between kickoffs.'},
  ncaaf:{ad:'NCAAF',spor:'football',  feed:/^americanfootball_ncaaf/,note:'Six FBS seasons of box scores (ESPN), 2021–2026. Profiles use the top and bottom third of FBS that season; FCS opponents appear in the record but carry no profile.'},
  mlb:  {ad:'MLB',  spor:'baseball',  feed:/^baseball_mlb/,        note:'Six MLB seasons of box scores (ESPN), 2021–2026, every game including the postseason. Lineup and pitching lines are from the box, not projections.'}
};
const Q=new URLSearchParams(location.search);
let LIG=LIGS[Q.get('lig')]?Q.get('lig'):'nba';
let DATA=LIG+'/', ODDS_HIST='../odds_history/'+LIG+'.json';
let IDX=null, LEAGUE=null, TEAMS=[], TCACHE={}, OH=null, TONIGHT=[];
const SPOR=()=>LIGS[LIG].spor, NEW=()=>!!(IDX&&IDX.spor);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const pct=(w,n)=>n>0?Math.round(1000*w/n)/10:null;
const fair=(p)=>(p!=null&&p>0)?(1/p).toFixed(2):null;
const usDate=(iso)=>{try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'});}catch(e){return String(iso||'').slice(0,10);}};
const niceDate=(ymd)=>{try{const d=new Date(ymd+'T12:00:00Z');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return ymd;}};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000);
const avg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
const f1=(x)=>x==null?'—':(Math.round(x*10)/10).toFixed(1);
const sd=(d)=>{const v=Math.round(d*10)/10;return (v>0?'+':'')+v.toFixed(1);};
// ESPN ham degerleri: "4-8" -> 4 ; "12/19" -> 12 ; "+4" -> 4 ; "--" -> null
function num(s){ if(s==null)return null; if(typeof s==='number')return s; s=String(s).trim(); if(s===''||s==='--'||s==='-')return null;
  if(/^[+-]?\d+(\.\d+)?$/.test(s))return parseFloat(s); const m=s.match(/^(\d+(\.\d+)?)/); return m?parseFloat(m[1]):null; }
function num2(s){ const m=String(s==null?'':s).match(/^\d+(\.\d+)?[-\/](\d+(\.\d+)?)/); return m?parseFloat(m[2]):null; }

// ---- spor konfigurasyonu ----
const CFG={
  basketball:{unit:'pts',unitLong:'pts/game',xray:[['pts','points'],['reb','rebounds'],['tpm','threes'],['ast','assists']],
              cond:[['pts','points'],['reb','rebounds'],['ast','assists'],['tpm','threes'],['pf','fouls']],ptsLead:2},
  football:  {unit:'pts',unitLong:'pts/game',xray:[['pts','points'],['pass_yds','pass yds'],['rush_yds','rush yds'],['to','turnovers']],
              cond:[['pts','points'],['pass_yds','pass yds'],['rush_yds','rush yds'],['to','turnovers'],['sacks','sacks']],ptsLead:2},
  baseball:  {unit:'runs',unitLong:'runs/game',xray:[['pts','runs'],['h','hits'],['hr','homers'],['k','strikeouts']],
              cond:[['pts','runs'],['h','hits'],['hr','homers'],['k','strikeouts'],['bb','walks']],ptsLead:0.4}
};
const SZ_OF=(ymd)=>{const y=+ymd.slice(0,4), m=+ymd.slice(5,7);
  if(LIG==='nba')return m>=9?`${y}-${String(y+1).slice(2)}`:`${y-1}-${String(y).slice(2)}`;
  if(SPOR()==='football')return String(m>=8?y:y-1); return String(y);};
const MIN_N=15;

// ---- takim esleme: The Odds API adi -> ESPN takimi (tam ad -> alias -> lakap(son kelime)) ----
const ALIAS={'la clippers':'los angeles clippers','los angeles clippers':'la clippers','oakland athletics':'athletics','cleveland indians':'cleveland guardians','washington football team':'washington commanders'};
function findTeam(name){
  if(!name||!TEAMS.length)return null;
  const n=String(name).toLowerCase().trim();
  let t=TEAMS.find(x=>x.ad.toLowerCase()===n); if(t)return t;
  if(ALIAS[n]){t=TEAMS.find(x=>x.ad.toLowerCase()===ALIAS[n]); if(t)return t;}
  const nick=n.split(' ').pop();
  const c=TEAMS.filter(x=>x.ad.toLowerCase().split(' ').pop()===nick);
  if(c.length===1)return c[0];
  if(c.length>1){const c2=c.filter(x=>n.includes(x.ad.toLowerCase().split(' ')[0]));if(c2.length===1)return c2[0];}
  const c3=TEAMS.filter(x=>n.includes(x.ad.toLowerCase())||x.ad.toLowerCase().includes(n)); if(c3.length===1)return c3[0];
  return null;
}
const KISA={'boston red sox':'Red Sox','chicago white sox':'White Sox','toronto blue jays':'Blue Jays','portland trail blazers':'Trail Blazers'};
const short=(t)=>t.kisa||t.ad;
const poss=(s)=>/s$/i.test(s)?s+"'":s+"'s";
async function teamFile(t){
  if(TCACHE[t.slug])return TCACHE[t.slug];
  const r=await fetch(DATA+'teams/'+t.slug+'.json',{cache:'no-store'});
  const f=r.ok?await r.json():null; if(f)enrich(t,f); TCACHE[t.slug]=f; return f;
}
async function oddsHist(){ if(OH!==null)return OH; try{const r=await fetch(ODDS_HIST,{cache:'no-store'});OH=r.ok?await r.json():false;}catch(e){OH=false;} return OH; }

// ---- veri erisimi: NBA (eski sema: box.p / opp_box) ve yeni sema (box.<grup> / m / om) ayni arayuzden ----
function gStats(g){ if(NEW())return g.m||{}; let pts=0,reb=0,ast=0,tpm=0,pf=0,to=0,hasT=false,hasF=false;
  for(const p of (g.box&&g.box.p)||[]){pts+=p[3]||0;reb+=p[4]||0;ast+=p[5]||0;
    if(p.length>7&&p[7]!=null){tpm+=p[7];hasT=true;} if(p.length>12&&p[12]!=null){pf+=p[12];hasF=true;} if(p.length>11&&p[11]!=null)to+=p[11];}
  return {pts,reb,ast,tpm:hasT?tpm:null,pf:hasF?pf:null,to:hasF?to:null}; }
function bRows(g){  // basketbol oyuncu satirlari, normalize
  if(!NEW())return ((g.box&&g.box.p)||[]).map(p=>({ad:p[0],st:p[1],min:p[2],pts:p[3],reb:p[4],ast:p[5],pm:p[6],tpm:p[7],pf:p[12],to:p[11]}));
  const L=(IDX.labels&&IDX.labels.stats)||[]; const I=k=>L.indexOf(k)+2;
  return ((g.box&&g.box.stats)||[]).map(r=>({ad:r[0],st:r[1],min:num(r[I('MIN')]),pts:num(r[I('PTS')]),reb:num(r[I('REB')]),ast:num(r[I('AST')]),pm:num(r[I('+/-')]),tpm:num(r[I('3PT')]),pf:num(r[I('PF')]),to:num(r[I('TO')])}));
}
function gRows(g,grp){ // futbol/beyzbol grup satirlari -> {ad,st,v:{label:raw}}
  const L=(IDX.labels&&IDX.labels[grp])||[]; return ((g.box&&g.box[grp])||[]).map(r=>{const v={}; L.forEach((k,i)=>v[k]=r[i+2]); return {ad:r[0],st:r[1],v};});
}
const dnpOf=(g)=>(g.box&&g.box.dnp)||[];
function oppBoxGame(g,oppFile){ if(!NEW())return g.opp_box?{box:g.opp_box}:null; return (oppFile&&oppFile.games||[]).find(x=>x.t===g.t)||null; }

// yeni semada takim ozeti dosyadan hesaplanir (NBA index'te hazir gelir)
function enrich(t,f){
  if(t.home)return; const gs=f.games||[];
  const H=gs.filter(g=>g.home), A=gs.filter(g=>!g.home);
  t.home=[H.length,H.filter(g=>g.won).length,Math.round(10*(avg(H.map(g=>g.pts))||0))/10];
  t.away=[A.length,A.filter(g=>g.won).length,Math.round(10*(avg(A.map(g=>g.pts))||0))/10];
  const B=gs.filter(g=>g.b2b); t.b2b=[B.length,B.filter(g=>g.won).length];
  t.last=gs.length?gs[gs.length-1].t:null;
  if(SPOR()==='basketball'){ // yildizlar: son iki sezon, >=15 mac, ppg
    const szs=[...new Set(gs.map(g=>g.sz))].sort().slice(-2); const P={};
    gs.filter(g=>szs.includes(g.sz)).forEach(g=>{bRows(g).forEach(r=>{if(r.min==null||r.min<=0)return;const o=P[r.ad]||(P[r.ad]={gp:0,pts:0});o.gp++;o.pts+=r.pts||0;});});
    t.stars=Object.entries(P).filter(([_,o])=>o.gp>=15).map(([ad,o])=>({ad,gp:o.gp,ppg:Math.round(10*o.pts/o.gp)/10})).sort((x,y)=>y.ppg-x.ppg).slice(0,8);
  }
}

// ---- saf hesaplar ----
function liveDatesFor(teamAd,oh){
  const out=[]; if(!oh||!oh.maclar)return out;
  const n=String(teamAd).toLowerCase();
  for(const [k,list] of Object.entries(oh.maclar)){ if(!k.split('|').includes(n))continue;
    for(const r of list){ if(r.t)out.push(usDate(r.t)); } }
  return out;
}
function restBefore(games,ymd,oh,teamAd){
  let last=null; for(const g of games){ if(g.t<ymd)last=g; else break; }
  let lastT=last?last.t:null, src='archive';
  for(const d of liveDatesFor(teamAd,oh)){ if(d<ymd&&(!lastT||d>lastT)){lastT=d;src='daily';} }
  if(!lastT)return null; return {rest:daysBetween(lastT,ymd)-1,lastT,src};
}
function lastMeeting(games,oppAd,beforeYmd){ let m=null; for(const g of games){ if(g.opp===oppAd&&(!beforeYmd||g.t<beforeYmd))m=g; } return m; }
function starsLast10(games,stars,beforeYmd){
  const recent=games.filter(g=>!beforeYmd||g.t<beforeYmd).slice(-10);
  return stars.map(s=>{
    const seen=recent.filter(g=>bRows(g).some(p=>p.ad===s.ad)||dnpOf(g).includes(s.ad)).length;
    return {ad:s.ad,ppg:s.ppg,sat:recent.filter(g=>dnpOf(g).includes(s.ad)).length,n:recent.length,seen};
  }).filter(s=>s.seen>0);
}
const before=(games,ymd)=>games.filter(g=>!ymd||g.t<ymd);

// ---- ortak kartlar ----
function cardHomeAway(h,a){
  const C=CFG[SPOR()]; const hp=pct(h.home[1],h.home[0]), ap=pct(a.away[1],a.away[0]);
  const ins=`↑ ${esc(short(h))} wins <span class="rnum">${hp}%</span> at home · ${esc(short(a))} wins <span class="rnum">${ap}%</span> on the road · league home side ${LEAGUE.home_win_pct}%.`;
  return `<div class="tgol"><div class="th">HOME / AWAY RECORD</div>
    <div class="ts"><b>${esc(short(h))}</b> at home <b>${h.home[1]}-${h.home[0]-h.home[1]}</b> · <b>${h.home[2]}</b> ${C.unitLong}<br><b>${esc(short(a))}</b> on the road <b>${a.away[1]}-${a.away[0]-a.away[1]}</b> · <b>${a.away[2]}</b> ${C.unitLong}</div>
    <div class="rins">${ins}</div><div class="tf">all games in the record</div></div>`;
}
function cardB2B(h,a,hR,aR){
  const lb=LEAGUE.b2b||{gp:0,w:0}, lr=LEAGUE.rest||{gp:0,w:0}; const lbp=pct(lb.w,lb.gp), lrp=pct(lr.w,lr.gp);
  const line=(t,r)=>{ if(!r)return `<b>${esc(short(t))}</b> — no earlier game in the record`;
    const own=pct(t.b2b[1],t.b2b[0]);
    const tag=r.rest===0?`<span class="kartEksi">played last night</span> (0 days rest)`:(r.rest>=20?`no game in the record for <b>${r.rest}</b> days <span style="color:var(--grey)">(daily archive fills in as the season runs)</span>`:`<b>${r.rest}</b> day${r.rest===1?'':'s'} rest`);
    return `<b>${esc(short(t))}</b> · ${tag} · their back-to-back record <b>${t.b2b[1]}-${t.b2b[0]-t.b2b[1]}</b>${own!=null?` (${own}%)`:''}`; };
  const onB2B=[hR&&hR.rest===0?h:null,aR&&aR.rest===0?a:null].filter(Boolean);
  let ins;
  if(onB2B.length===2)ins=`↑ Both on the second night — <span class="rnum">no rest edge</span> either way.`;
  else if(onB2B.length===1)ins=`↑ ${esc(short(onB2B[0]))} on the second night — such teams win <span class="rnum">${lbp}% vs ${lrp}%</span> rested, across ${lb.gp.toLocaleString('en-US')} games.`;
  else if((hR&&hR.rest>=20)||(aR&&aR.rest>=20))ins=`↑ Rest can't be read yet — <span class="rnum">recent games missing</span> from the record; this fills in daily once the season is underway.`;
  else ins=`↑ Both rested — <span class="rnum">no back-to-back factor</span> tonight.`;
  return `<div class="tgol"><div class="th">B2B RECORD</div><div class="ts">${line(h,hR)}<br>${line(a,aR)}</div>
    <div class="rins">${ins}</div><div class="tf">league: second night ${lbp}% · rested ${lrp}% · all seasons</div></div>`;
}
function cardAvail(h,a,hS,aS){
  const row=(t,S)=>S.length?S.slice(0,4).map(s=>`<b>${esc(s.ad)}</b> <span class="mono" style="color:var(--grey)">${s.ppg} ppg</span> · sat <b class="${s.sat>=3?'kartEksi':''}">${s.sat}</b> of ${s.n}`).join('<br>'):'<span style="color:var(--grey)">no regulars seen in the last 10</span>';
  const all=[...hS.map(s=>({...s,team:h})),...aS.map(s=>({...s,team:a}))].sort((x,y)=>y.sat-x.sat);
  const top=all[0];
  const ins=top&&top.sat>0?`↑ <span class="rnum">${esc(top.ad)}</span> sat ${top.sat} of the last ${top.n} — availability is a record of its own.`:`↑ Full strength lately — <span class="rnum">stars missed 0</span> of the last 10.`;
  return `<div class="tgol"><div class="th">AVAILABILITY · LAST 10</div>
    <div class="ts"><span style="color:var(--grey)">${esc(short(h))}</span><br>${row(h,hS)}<br><span style="color:var(--grey)">${esc(short(a))}</span><br>${row(a,aS)}</div>
    <div class="rins">${ins}</div><div class="tf">top scorers by ppg · "sat" = on roster, no minutes</div></div>`;
}

// ---- futbol kartlari ----
function cardRestFB(h,a,hR,aR,hf,af){
  const longRest=(f)=>{const L=f.games.filter(g=>g.rest!=null&&g.rest>=10); return [L.length,L.filter(g=>g.won).length];};
  const line=(t,r,f)=>{ if(!r)return `<b>${esc(short(t))}</b> — no earlier game in the record`;
    const lr=longRest(f); const tag=r.rest>=12?`<span class="kartArti">off a bye</span> (${r.rest} days)`:(r.rest<=4?`<span class="kartEksi">short week</span> (${r.rest} days)`:`<b>${r.rest}</b> days since last game`);

function oppProfile(teamAd,ymd){

  const cur=SZ_OF(ymd); const szs=Object.keys(P).sort(); const minGp=IDX.min_gp||MIN_N;

  if(!P[cur]||(P[cur].gp||0)<minGp){ const prev=szs.filter(z=>z<cur).pop(); if(!prev)return null; use=prev; early=true; }
  return {season:use,early,curGp:P[cur]?P[cur].gp:0,prof:P[use]};
}

let GL=null, ZS=null, TOTQ=null, PAV={};
async function gamesList(){ if(GL!==null)return GL;
  try{const r=await fetch(DATA+'games.json',{cache:'no-store'}); const j=r.ok?await r.json():null;
    GL=j?j.games.map(r=>({t:r[0],h:r[1],a:r[2],hs:r[3],as:r[4],sz:r[5],rh:r[6],ra:r[7],hh:r[8],ah:r[9],spd:r[10],ou:r[11]})):false;}catch(e){GL=false;}
  return GL; }
const METS=()=>NEW()?(IDX.metrics||[]):['pts','pa','reb','ast','tpm','pf','to'];
const avgOf=(p)=>p?(NEW()?p.avg:p):null;
function profAvg(team,sz){ const k=team+'|'+sz; if(k in PAV)return PAV[k];
  const p=IDX.profiles&&IDX.profiles[team]&&IDX.profiles[team][sz]; const src=avgOf(p); let o=null;
  if(src&&(p.gp||0)>=(IDX.min_gp||MIN_N)){ o={}; for(const m of METS()){ if(src[m]==null){o=null;break;} o[m]=src[m]; } }
  PAV[k]=o; return o; }
function zstats(){ if(ZS)return ZS; ZS={}; const minGp=IDX.min_gp||MIN_N;
  for(const S of Object.values(IDX.profiles||{}))for(const [sz,p] of Object.entries(S)){ if((p.gp||0)<minGp)continue; const src=avgOf(p); const z=ZS[sz]||(ZS[sz]={});
    for(const m of METS()){ if(src[m]==null)continue; const a=z[m]||(z[m]={n:0,s:0,s2:0}); a.n++; a.s+=src[m]; a.s2+=src[m]*src[m]; } }
  for(const z of Object.values(ZS))for(const a of Object.values(z)){ a.mean=a.s/a.n; a.sd=Math.sqrt(Math.max(0,a.s2/a.n-a.mean*a.mean))||1; }
  return ZS; }
function zvec(prof,sz){ const z=zstats()[sz]; if(!z||!prof)return null; return METS().map(m=>z[m]?(prof[m]-z[m].mean)/z[m].sd:0); }
function restB(r){ if(r==null)return 1; if(SPOR()==='football')return r<=4?0:(r<=9?1:2); return r<=0?0:(r===1?1:(r<=3?2:3)); }
function feat(hp,ap,sz,rh,ra){ const zh=zvec(hp,sz), za=zvec(ap,sz); if(!zh||!za)return null; return [...zh,...za,restB(rh)*0.6,restB(ra)*0.6]; }
function totQ(){ if(TOTQ)return TOTQ; TOTQ={}; const by={}; for(const g of GL){ (by[g.sz]||(by[g.sz]=[])).push(g.hs+g.as); }
  for(const [sz,v] of Object.entries(by)){ v.sort((x,y)=>x-y); TOTQ[sz]=[v[Math.floor(v.length/3)],v[Math.floor(2*v.length/3)]]; } return TOTQ; }
const CLOSE={basketball:5,football:7,baseball:1};
const DNA_LAB={basketball:['defensive battle','middle band','shootout'],football:['low-scoring','middle band','shootout'],baseball:["pitchers' duel",'middle band','slugfest']};
const DNA_PH={'defensive battle':'a defensive battle','middle band':'in the middle band','shootout':'a shootout','low-scoring':'low-scoring',"pitchers' duel":"a pitchers' duel",'slugfest':'a slugfest'};
function twins(h,a,ymd,hR,aR){
  if(!GL||!GL.length)return null;
  const hp=oppProfile(h.ad,ymd), ap=oppProfile(a.ad,ymd); if(!hp||!ap)return null;
  const hz=zvec(avgOf(hp.prof),hp.season), az=zvec(avgOf(ap.prof),ap.season); if(!hz||!az)return null;
  const f0=[...hz,...az,restB(hR?hR.rest:null)*0.6,restB(aR?aR.rest:null)*0.6];
  const scored=[];
  for(const g of GL){ if(g.t>=ymd)continue; const f=feat(profAvg(g.h,g.sz),profAvg(g.a,g.sz),g.sz,g.rh,g.ra); if(!f)continue;
    let d=0; for(let i=0;i<f.length;i++){const e=f[i]-f0[i]; d+=e*e;} scored.push({g,d:Math.sqrt(d)}); }
  if(scored.length<MIN_N)return {n:scored.length,shown:false};
  scored.sort((x,y)=>x.d-y.d); const dMed=scored[Math.floor(scored.length/2)].d; const K=Math.min(40,scored.length); const top=scored.slice(0,K);
  const sim=(d)=>Math.max(0,Math.round(100*(1-(d/dMed)*(d/dMed))));   // 100 = ayni profil, 0 = lig medyani kadar uzak
  const Q=totQ(); let hw=0,hs=0,as=0,close=0,dna=[0,0,0],ov=0,nOu=0,hc=0,nSp=0;
  for(const {g} of top){ if(g.hs>g.as)hw++; hs+=g.hs; as+=g.as; if(Math.abs(g.hs-g.as)<=CLOSE[SPOR()])close++;
    const q=Q[g.sz]||[0,0]; const t=g.hs+g.as; dna[t<q[0]?0:(t>=q[1]?2:1)]++;
    if(g.ou!=null){nOu++; if(t>g.ou)ov++;} if(g.spd!=null){const c=g.hs-g.as+g.spd; if(c!==0){nSp++; if(c>0)hc++;}} }
  return {n:K,shown:true,list:top.slice(0,3).map(x=>({...x.g,sim:sim(x.d)})),homeW:pct(hw,K),avgH:hs/K,avgA:as/K,avgTot:(hs+as)/K,closePct:pct(close,K),
    dna:dna.map(x=>Math.round(100*x/K)),overPct:nOu>=MIN_N?pct(ov,nOu):null,nOu,homeCover:nSp>=MIN_N?pct(hc,nSp):null,nSp,avgSim:Math.round(top.reduce((s,x)=>s+sim(x.d),0)/K),early:hp.early||ap.early,pool:scored.length};
}

      <div><div class="th">matchup dna</div><div class="ts">${dnaTxt}</div><div class="th" style="margin-top:10px">closest three</div><div class="ts">${T.list.map(row).join('<br>')}</div></div>

function scriptRec(team,ymd){ let tw=0,tn=0,lw=0,ln=0;
  for(const g of GL){ if(g.t>=ymd||g.hh==null||g.ah==null)continue; const home=g.h===team; if(!home&&g.a!==team)continue;
    const my=home?g.hh:g.ah, op=home?g.ah:g.hh, won=home?g.hs>g.as:g.as>g.hs; if(my<op){tn++;if(won)tw++;} else if(my>op){ln++;if(won)lw++;} }
  return {tw,tn,lw,ln}; }
function leagueScript(){ let w=0,n=0; for(const g of GL){ if(g.hh==null||g.ah==null||g.hh===g.ah)continue; n++; const trailHome=g.hh<g.ah; if(trailHome?g.hs>g.as:g.as>g.hs)w++; } return pct(w,n); }
function cardScript(h,a,ymd){

function atsRec(team,ymd){ const r={fav:[0,0],dog:[0,0],homeFav:[0,0],homeDog:[0,0],awayFav:[0,0],awayDog:[0,0]};

function cardATS(h,a,ymd,market){

  const hFav=market&&market.h!=null&&market.a!=null?market.h>=market.a:null;

    const rows=keys.map(k=>r[k][0]>=MIN_N?{k,n:r[k][0],w:r[k][1],p:pct(r[k][1],r[k][0])}:null).filter(Boolean);

    return {html:`<b>${esc(short(t))}</b> · ${html}`,best:rows.sort((x,y)=>Math.abs(y.p-50)-Math.abs(x.p-50))[0],t};};

}

function oppQuality(X,O,Xf,ymd){
  const sz=SZ_OF(ymd); const opps=[...new Set(Xf.games.filter(g=>g.sz===sz&&g.t<ymd).map(g=>g.opp))]; if(opps.length<3)return '';
  const P=(t)=>{const p=IDX.profiles&&IDX.profiles[t]&&IDX.profiles[t][sz]; return avgOf(p);};
  const po=P(O.ad); if(!po)return '';
  const rank=(m,desc)=>{const vals=opps.map(P).filter(Boolean).map(p=>p[m]).filter(x=>x!=null); if(vals.length<3)return null; const n=vals.filter(v=>desc?v>po[m]:v<po[m]).length; return {r:n+1,n:vals.length+1};};
  const ro=rank('pts',true), rd=rank('pa',true); const out=[];
  if(ro&&ro.r===1)out.push(`the strongest offence ${esc(short(X))} has faced this season`); else if(ro&&ro.r===ro.n)out.push(`the weakest offence ${esc(short(X))} has faced this season`);
  if(rd&&rd.r===1)out.push(`the leakiest defence ${esc(short(X))} has faced this season`); else if(rd&&rd.r===rd.n)out.push(`the stingiest defence ${esc(short(X))} has faced this season`);
  return out.length?` <b style="color:var(--ink)">${out.join('; ')}</b> (of ${ro?ro.n:rd.n}).`:'';
}

  const when=whenIso?new Date(whenIso).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'any date';
  const link=deepLink(h,a);
  det.innerHTML=`<div class="dhead"><div><div class="teams">${esc(h.ad)} — ${esc(a.ad)}</div><div class="when">${esc(LIGS[LIG].ad)} · ${esc(when)} · record as of ${esc(ymd)}</div></div>
    <button class="btn ghost share" type="button" id="shareBtn" data-link="${esc(link)}">COPY LINK</button></div>
    <div class="grid">${cards.join('')}</div>`;
  try{history.replaceState(null,'',link);}catch(e){}
  const sb=document.getElementById('shareBtn'); if(sb)sb.addEventListener('click',()=>{try{navigator.clipboard.writeText(sb.dataset.link);sb.textContent='COPIED';setTimeout(()=>sb.textContent='COPY LINK',1500);}catch(e){}});
  window.scrollTo({top:det.offsetTop-10,behavior:'smooth'});
}
async function loadTonight(){
  const box=document.getElementById('list');
  try{
    const r=await fetch(HOST+'/bugun.json',{cache:'no-store'}); const b=await r.json();
    const blocks=Object.values(b.ligler||{}).filter(x=>LIGS[LIG].feed.test(x.key||''));
    TONIGHT=blocks.flatMap(x=>(x.maclar||[]).map(m=>({h:m.h,a:m.a,t:m.t,p:m.p,key:x.key})));
    TONIGHT.sort((x,y)=>String(x.t).localeCompare(String(y.t)));
    if(!TONIGHT.length){box.innerHTML=`<div class="empty">No ${esc(LIGS[LIG].ad)} games in the feed right now — pick two teams below.</div>`;return;}
    box.innerHTML=TONIGHT.map((m,i)=>{const fav=m.p&&m.p.h!=null&&m.p.a!=null?(m.p.h>=m.p.a?`${esc(m.h.split(' ').pop())} ${Math.round(m.p.h*100)}%`:`${esc(m.a.split(' ').pop())} ${Math.round(m.p.a*100)}%`):'';
      return `<button class="mrow" type="button" data-i="${i}"><div class="t">${esc(m.h)} — ${esc(m.a)}</div><div class="w">${new Date(m.t).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})}${m.key.includes('preseason')?' · preseason':''}${fav?' · market '+fav:''}</div></button>`;}).join('');
    box.querySelectorAll('.mrow').forEach(b=>b.addEventListener('click',()=>{box.querySelectorAll('.mrow').forEach(x=>x.classList.remove('on'));b.classList.add('on');const m=TONIGHT[+b.dataset.i];openRecord(m.h,m.a,m.t,m.p);}));
  }catch(e){box.innerHTML=`<div class="empty">Tonight's feed unreachable — pick two teams below.</div>`;}
}
// yeni sema index'i NBA semasina normalize et: tier etiketi -> high/low/mid ; esik yoksa mid
function normalizeIdx(I){
  if(!I.spor)return;
  const TL=I.tier_labels||{};
  for(const t of Object.values(I.profiles||{}))for(const [sz,p] of Object.entries(t)){
    const thr=(I.tier_thr||{})[sz]||{}; const out={};
    for(const [m,v] of Object.entries(p.tiers||{})){ const q=thr[m]; const L=TL[m]||[];
      out[m]=(!q||q[0]===q[1])?'mid':(v===L[0]?'high':(v===L[1]?'low':'mid')); }
    p.tiers=out;
  }
  const junk=/all-star|^afc$|^nfc$|^team |^brazil$|^national$|^american$/i;
  I.teams=(I.teams||[]).filter(t=>!junk.test(t.ad)).map(t=>({...t,kisa:LIG==='ncaaf'?t.ad:(KISA[t.ad.toLowerCase()]||t.ad.split(' ').pop())}));
}
function renderLigbar(){
  document.getElementById('ligbar').innerHTML=Object.entries(LIGS).map(([k,v])=>`<button type="button" data-lig="${k}" class="${k===LIG?'on':''}">${v.ad}</button>`).join('');
  document.querySelectorAll('#ligbar button').forEach(b=>b.addEventListener('click',()=>{const u=new URL(location.href);u.search='';u.searchParams.set('lig',b.dataset.lig);location.href=u.toString();}));
}
async function boot(){
  renderLigbar();
  document.getElementById('tag').textContent=`terminal · ${LIGS[LIG].ad.toLowerCase()} · build T6`;
  document.getElementById('note').textContent=LIGS[LIG].note+' Odds history builds daily from the archive. Direction, not advice.';
  document.title=`Brier Terminal — ${LIGS[LIG].ad}`;
  try{
    const r=await fetch(DATA+'index.json',{cache:'no-store'}); IDX=await r.json(); normalizeIdx(IDX);
    TEAMS=IDX.teams||[]; LEAGUE=IDX.league||{};
    const sel=TEAMS.filter(t=>(t.gp||0)>=10).slice().sort((x,y)=>x.ad.localeCompare(y.ad));
    const opts=sel.map(t=>`<option value="${esc(t.ad)}">${esc(t.ad)}</option>`).join('');
    document.getElementById('selH').innerHTML=opts; document.getElementById('selA').innerHTML=opts;
    document.getElementById('selA').selectedIndex=Math.min(1,sel.length-1);
    document.getElementById('goBtn').addEventListener('click',()=>openRecord(document.getElementById('selH').value,document.getElementById('selA').value,null));
    loadTonight();
    if(Q.get('h')&&Q.get('a')){ openRecord(Q.get('h'),Q.get('a'),null); }
  }catch(e){document.getElementById('list').innerHTML=`<div class="empty err">Record index not found (${esc(DATA)}index.json). Upload terminal/${esc(LIG)} first.</div>`;}
}
boot();
</script>
